backend:
  name: gitlab
  repo: root/generalwebtrunk
  branch: preview
  auth_type: pkce
  app_id: 90d5b75ddf8e1cfd79b14ab77cb60cd6a409e77288c557d5a1d986e3df0a2c3b
  api_root: https://192.168.0.152:8081/api/v4
  base_url: https://192.168.0.152:8081
  auth_endpoint: oauth/authorize

local_backend: true

site_url: "https://192.168.0.91:8089/kostasoft-site-preview/"
display_url: "https://192.168.0.91:8089/kostasoft-site-preview/"
logo_url: "/kostasoft-site-preview/favicon.svg"
locale: "ru"

media_folder: "public/assets/"
public_folder: "/kostasoft-site-preview/assets/"

collections:
  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "newsHome"
        label: "Блок новостей на главной"
        file: "src/content/settings/news-home.md"
        fields:
          - { label: "Показывать блок", name: "enabled", widget: "boolean", default: false }
          - { label: "Заголовок блока", name: "title", widget: "string", default: "Новости и материалы", pattern: &required_text_pattern ['.*\S.*', "Поле не должно быть пустым или состоять только из пробелов."] }
          - { label: "Текст кнопки", name: "buttonText", widget: "string", default: "Все новости", pattern: *required_text_pattern }
          - { label: "Количество материалов", name: "limit", widget: "number", default: 3, min: 1, max: 12, value_type: "int" }
          - label: "Режим вывода"
            name: "mode"
            widget: "select"
            default: "auto"
            options:
              - { label: "Автоматически: последние публикации", value: "auto" }
              - { label: "Вручную: выбранные slug", value: "manual" }
          - label: "Slug публикаций для ручного режима"
            name: "manualNews"
            widget: "list"
            required: false
            hint: "Укажите slug материалов в нужном порядке, например avicenna-telemedforum-2026."
            field: { label: "Slug", name: "slug", widget: "string", pattern: &slug_pattern ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Используйте только латиницу в нижнем регистре, цифры и дефисы."] }
      - name: "heroSection"
        label: "Hero на главной"
        file: "src/content/settings/hero-section.md"
        fields:
          - { label: "Hero kicker", name: "kicker", widget: "string", default: "МИС Авиценна", pattern: *required_text_pattern }
          - { label: "H1 строка 1", name: "h1Line1", widget: "string", pattern: *required_text_pattern }
          - { label: "H1 строка 2", name: "h1Line2", widget: "string", pattern: *required_text_pattern }
          - { label: "H1 строка 3", name: "h1Line3", widget: "string", pattern: *required_text_pattern }
          - { label: "Подзаголовок", name: "lead", widget: "text", pattern: *required_text_pattern }
          - { label: "Текст CTA", name: "ctaLabel", widget: "string", pattern: *required_text_pattern }
      - name: "metricsBand"
        label: "Блок метрик на главной"
        file: "src/content/settings/metrics-band.md"
        fields:
          - label: "Метрики"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Значение", name: "value", widget: "string", pattern: &metric_value_pattern ['^(?:XXX\+|\d+[\d\s.,]*\s*(?:\+\s*)?(?:%|x|ч|дн|дней|лет|мес|млн|млрд|тыс)?)$', "Укажите числовое значение, например 100+, 25%, 3 млн или XXX+."] }
              - { label: "Подпись", name: "label", widget: "string", pattern: *required_text_pattern }
              - { label: "Изображение (1536x1024 px)", name: "image", widget: "image", hint: "Файл в public/assets/metrics, например 01-scale.png." }
      - name: "functionalitySection"
        label: "Блок «Функции»"
        file: "src/content/settings/functionality-section.md"
        fields:
          - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
          - label: "Карточки функций"
            name: "groups"
            widget: "list"
            summary: "{{front.heading}}"
            fields:
              - label: "Лицевая сторона визуальной карточки"
                name: "front"
                widget: "object"
                required: false
                fields:
                  - { label: "Иконка (180x164 px)", name: "icon", widget: "image", hint: "Путь от public, например assets/functions/module-01-front-icon.png." }
                  - { label: "Фоновое изображение (1086x1448 px)", name: "backgroundImage", widget: "image", required: false, hint: "Путь от public, например assets/functions/module-01-front.webp." }
                  - { label: "Заголовок", name: "heading", widget: "string", pattern: *required_text_pattern }
                  - { label: "Текст", name: "copy", widget: "text", pattern: *required_text_pattern }
                  - { label: "Нижнее изображение (272x44 px)", name: "footerImage", widget: "image", hint: "Путь от public." }
              - label: "Обратная сторона визуальной карточки"
                name: "back"
                widget: "object"
                required: false
                fields:
                  - { label: "Фоновое изображение (1086x1448 px)", name: "backgroundImage", widget: "image", required: false, hint: "Путь от public, например assets/functions/module-01-back.webp." }
                  - { label: "CSS-класс сетки", name: "gridClass", widget: "string", required: false, hint: "Например: function-card-back-grid--four-rows или function-card-back-grid--three-rows.", pattern: &optional_text_pattern ['^$|.*\S.*', "Если поле заполнено, оно не должно состоять только из пробелов."] }
                  - label: "Пункты обратной стороны"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Иконка (180x164 px)", name: "icon", widget: "image", hint: "Путь от public, например assets/functions/module-01-back-grid-1-1-icon.png." }
                      - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
                      - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
      - name: "aiSection"
        label: "Блок AI / Докки"
        file: "src/content/settings/ai-section.md"
        fields:
          - { label: "Служебная надпись", name: "eyebrow", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Описание", name: "lead", widget: "text", pattern: *required_text_pattern }
          - label: "Карточки"
            name: "cards"
            widget: "list"
            fields:
              - label: "Тип карточки"
                name: "key"
                widget: "select"
                options:
                  - { label: "Докки", value: "dokki" }
                  - { label: "Докки Эксперт", value: "dokki-expert" }
              - { label: "Основное изображение карточки (924x730 px)", name: "image", widget: "image", required: false, hint: "Управляет изображением ai-card-base. Путь от public, например assets/dokki/dokki-bottom.png." }
      - name: "growthSection"
        label: "Блок развития"
        file: "src/content/settings/growth-section.md"
        fields:
          - { label: "Служебная надпись", name: "eyebrow", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Описание", name: "lead", widget: "text", pattern: *required_text_pattern }
          - { label: "Заголовок подключенных модулей", name: "currentTitle", widget: "string", pattern: *required_text_pattern }
          - label: "Подключено сейчас"
            name: "currentModules"
            widget: "list"
            fields:
              - { label: "Модуль", name: "text", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок будущих модулей", name: "laterTitle", widget: "string", pattern: *required_text_pattern }
          - label: "Можно подключить позже"
            name: "laterModules"
            widget: "list"
            fields:
              - { label: "Модуль", name: "text", widget: "string", pattern: *required_text_pattern }
      - name: "supportSection"
        label: "Блок сопровождения"
        file: "src/content/settings/support-section.md"
        fields:
          - { label: "Служебная надпись", name: "eyebrow", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Описание", name: "lead", widget: "text", pattern: *required_text_pattern }
          - { label: "Текст CTA", name: "ctaLabel", widget: "string", pattern: *required_text_pattern }
          - label: "Услуги"
            name: "services"
            widget: "list"
            fields:
              - { label: "Текст", name: "text", widget: "string", pattern: *required_text_pattern }
              - { label: "Акцентная карточка", name: "accent", widget: "boolean", default: false }
      - name: "faqSection"
        label: "Блок FAQ"
        file: "src/content/settings/faq-section.md"
        fields:
          - { label: "Служебная надпись", name: "eyebrow", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Текст CTA", name: "ctaLabel", widget: "string", pattern: *required_text_pattern }
          - label: "Вопросы"
            name: "items"
            widget: "list"
            fields:
              - { label: "Вопрос", name: "question", widget: "string", pattern: *required_text_pattern }
              - { label: "Ответ", name: "answer", widget: "text", pattern: *required_text_pattern }
      - name: "siteFooter"
        label: "Футер сайта"
        file: "src/content/settings/site-footer.md"
        fields:
          - { label: "Версия", name: "footerVersion", widget: "string", pattern: *required_text_pattern, hint: "Показывается в скрытом поле version в футере." }
      - name: "itActivityLegalPage"
        label: "Страница «IT-деятельность»"
        file: "src/content/settings/it-activity.md"
        fields:
          - { label: "Надзаголовок", name: "eyebrow", widget: "string", default: "Раскрытие информации" }
          - { label: "Заголовок страницы", name: "title", widget: "string", default: "Сведения об IT-деятельности" }
          - { label: "SEO title", name: "seoTitle", widget: "string", required: false, default: "Сведения об IT-деятельности - КОСТА", pattern: *optional_text_pattern }
          - { label: "SEO description", name: "seoDescription", widget: "text", required: false, default: "Сведения об IT-деятельности, государственной аккредитации, услугах и технологиях ООО «КОСТА».", pattern: *optional_text_pattern }
          - label: "Вводный блок"
            name: "intro"
            widget: "list"
            summary: "{{fields.text}}"
            default:
              - { text: "Информация размещена в соответствии с требованиями Положения о государственной аккредитации российских организаций, осуществляющих деятельность в области информационных технологий, утверждённого постановлением Правительства РФ от 30.09.2022 № 1729 (в редакции от 28.11.2025), и приказа Минцифры России от 02.06.2025 № 511." }
              - { text: "Все сведения, размещённые на этой странице, доступны круглосуточно без необходимости регистрации, авторизации или предоставления персональных данных." }
            fields:
              - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
          - label: "Раздел 1. Реквизиты организации"
            name: "details"
            widget: "list"
            summary: "{{fields.label}}"
            default:
              - { label: "Полное наименование", value: "Общество с ограниченной ответственностью «КОСТА»" }
              - { label: "Сокращенное наименование", value: "ООО «КОСТА»" }
              - { label: "Юридический адрес", value: "190013, город Санкт-Петербург, вн.тер.г. муниципальный округ Семеновский, ул. Можайская, д.17 литера А, помещ. 6Н, комн. 421" }
              - { label: "ИНН", value: "7811766991" }
              - { label: "ОГРН", value: "1217800166099" }
              - { label: "КПП", value: "783801001" }
              - { label: "Телефон", value: "+7 (812) 320-06-07", href: "tel:+78123200607" }
              - { label: "Email", value: "info@kostasoft.ru", href: "mailto:info@kostasoft.ru" }
            fields:
              - { label: "Название", name: "label", widget: "string", pattern: *required_text_pattern }
              - { label: "Значение", name: "value", widget: "text", pattern: *required_text_pattern }
              - { label: "Ссылка", name: "href", widget: "string", required: false, pattern: &contact_href_pattern ['^(?:tel:\\+?[0-9]{6,15}|mailto:[^\\s@]+@[^\\s@]+\\.[^\\s@]+)$', "Укажите ссылку в формате tel:... или mailto:..."] }
          - { label: "Заголовок раздела 2", name: "accreditationTitle", widget: "string", default: "Раздел 2. Государственная аккредитация" }
          - label: "Раздел 2. Абзацы"
            name: "accreditationParagraphs"
            widget: "list"
            summary: "{{fields.text}}"
            default:
              - { text: "ООО «КОСТА» включена в реестр аккредитованных организаций, осуществляющих деятельность в области информационных технологий, ведущийся Министерством цифрового развития, связи и массовых коммуникаций Российской Федерации." }
              - { text: "Реестровая запись №АО-20220310-3778453212-3 от 2022-03-11." }
              - { text: "Проверить статус: https://www.gosuslugi.ru/itorgs" }
              - { text: "МИС «Авиценна» включена в «Единый реестр российских программ для электронных вычислительных машин и баз данных» под номером 10807." }
              - { text: "Свидетельство о государственной регистрации программы для ЭВМ № 2010615697 от 02.09.2010 с изменением от 09.12.2021 № РП0011356." }
            fields:
              - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
          - { label: "Заголовок раздела 3", name: "activityTitle", widget: "string", default: "Раздел 3. Виды деятельности" }
          - { label: "Основной ОКВЭД", name: "mainOkved", widget: "text", default: "63.11.1 — Деятельность по созданию и использованию баз данных и информационных ресурсов." }
          - { label: "Заголовок дополнительных ОКВЭД", name: "additionalOkvedTitle", widget: "string", default: "Дополнительные ОКВЭД:" }
          - label: "Дополнительные ОКВЭД"
            name: "additionalOkved"
            widget: "list"
            summary: "{{fields.text}}"
            default:
              - { text: "62.01 Разработка компьютерного программного обеспечения." }
              - { text: "62.02 Деятельность консультативная и работы в области компьютерных технологий." }
            fields:
              - { label: "Текст", name: "text", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок кодов деятельности", name: "activityCodesTitle", widget: "text", default: "Виды деятельности в соответствии с приказом Минцифры России от 11.05.2023 № 449:" }
          - label: "Коды деятельности"
            name: "activityCodes"
            widget: "list"
            summary: "{{fields.title}}"
            default:
              - { title: "Код 1.01", text: "Проектирование, и (или) обследование, и (или) разработка, и (или) адаптация, и (или) модификация (в том числе локализация, кастомизация, доработка), и (или) обратное проектирование (реверсивный инжиниринг), и (или) модернизация, и (или) обновление, и (или) установка, и (или) интеграция, и (или) настройка, и (или) конфигурирование, и (или) внедрение, и (или) сопровождение, и (или) тестирование, и (или) испытания, и (или) техническая поддержка, и (или) эксплуатация, включая администрирование, а также оказание услуг (в том числе консультационных, услуг по обучению, экспертных услуг и иных) в указанных видах деятельности (далее - проектирование и (или) иная деятельность, а также оказание услуг), в отношении программ для электронных вычислительных машин (далее - программы для ЭВМ), и (или) баз данных (в том числе их обновлений и исправлений), и (или) визуальных пользовательских интерфейсов." }
              - { title: "Код 10.01", text: "Деятельность по созданию, обучению и поддержке функционирования нейросетей, а также оказание услуг (выполнение работ) по автоматическому распознаванию различного вида изображений, видеопотока, и (или) текстов, и (или) речи, или иных звуков, а также их верификации и преобразованию." }
            fields:
              - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
              - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
          - { label: "Заголовок раздела 4", name: "servicesTitle", widget: "string", default: "Раздел 4. Описание услуг" }
          - { label: "Описание услуг", name: "servicesIntro", widget: "text", default: "ООО «КОСТА» оказывает услуги по внедрению и сопровождению полнофункциональной медицинской информационной системы «Авиценна»." }
          - { label: "Заголовок направлений", name: "servicesLead", widget: "string", default: "Основные направления работы:" }
          - label: "Основные направления работы"
            name: "serviceDirections"
            widget: "list"
            summary: "{{fields.text}}"
            default:
              - { text: "Внедрение МИС «Авиценна»: предпроектное исследование, настройка, конфигурирование, запуск системы." }
              - { text: "Сопровождение и развитие МИС «Авиценна»." }
              - { text: "Интеграция МИС «Авиценна» с другими системами заказчика." }
              - { text: "Обучение сотрудников заказчика работе в МИС «Авиценна»." }
            fields:
              - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
          - { label: "Заголовок раздела 5", name: "technologiesTitle", widget: "string", default: "Раздел 5. Технологии и инструменты" }
          - { label: "Вводный текст технологий", name: "technologiesIntro", widget: "string", default: "В работе мы используем:" }
          - label: "Технологии"
            name: "technologies"
            widget: "list"
            summary: "{{fields.text}}"
            default:
              - { text: "HTML, CSS" }
              - { text: "JavaScript" }
              - { text: "SignalR" }
              - { text: "C#, ASP.NET Core Identity" }
              - { text: "SQL" }
            fields:
              - { label: "Текст", name: "text", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок раздела 6", name: "priceTitle", widget: "string", default: "Раздел 6. Стоимость услуг" }
          - { label: "Стоимость услуг", name: "priceText", widget: "text", default: "Минимальная стоимость МИС «Авиценна» - от 25 000 рублей за одну конкурентную лицензию." }
      - name: "privacyLegalPage"
        label: "Страница «Политика конфиденциальности»"
        file: "src/content/settings/privacy-page.md"
        fields:
          - { label: "Надзаголовок", name: "eyebrow", widget: "string", default: "Документ", pattern: *required_text_pattern }
          - { label: "Заголовок страницы", name: "title", widget: "string", default: "Политика конфиденциальности персональных данных", pattern: *required_text_pattern }
          - { label: "SEO title", name: "seoTitle", widget: "string", required: false, default: "Политика конфиденциальности персональных данных - Авиценна", pattern: *optional_text_pattern }
          - { label: "SEO description", name: "seoDescription", widget: "text", required: false, default: "Политика конфиденциальности персональных данных сайта КОСТА информационные технологии.", pattern: *optional_text_pattern }
          - { label: "Содержимое страницы", name: "body", widget: "markdown" }
      - name: "personalDataLegalPage"
        label: "Страница «Согласие на обработку персональных данных»"
        file: "src/content/settings/personal-data-page.md"
        fields:
          - { label: "Надзаголовок", name: "eyebrow", widget: "string", default: "Документ", pattern: *required_text_pattern }
          - { label: "Заголовок страницы", name: "title", widget: "string", default: "Согласие на обработку персональных данных", pattern: *required_text_pattern }
          - { label: "SEO title", name: "seoTitle", widget: "string", required: false, default: "Согласие на обработку персональных данных - Авиценна", pattern: *optional_text_pattern }
          - { label: "SEO description", name: "seoDescription", widget: "text", required: false, default: "Согласие на обработку персональных данных для пользователей сайта KostaSoft.", pattern: *optional_text_pattern }
          - label: "Вводный блок"
            name: "intro"
            widget: "list"
            required: false
            fields:
              - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
          - label: "Разделы"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string", pattern: *required_text_pattern }
              - label: "Абзацы"
                name: "paragraphs"
                widget: "list"
                required: false
                fields:
                  - { label: "Текст", name: "text", widget: "text", pattern: *required_text_pattern }
              - label: "Пункты списка"
                name: "listItems"
                widget: "list"
                required: false
          - { label: "Итоговое примечание", name: "footerNote", widget: "text", required: false, pattern: *optional_text_pattern }
          - { label: "Итоговые контакты", name: "footerContacts", widget: "text", required: false, pattern: *optional_text_pattern }
      - name: "trustedClients"
        label: "Блок «Нам доверяют»"
        file: "src/content/settings/clients-section.md"
        format: "frontmatter"
        media_folder: "/public/assets/trust"
        public_folder: "/kostasoft-site-preview/assets/trust/"
        fields:
          - { label: "Служебная надпись", name: "eyebrow", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок, строка 1", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Заголовок, строка 2", name: "titleSuffix", widget: "string", required: false, default: "лидеры здравоохранения", pattern: *optional_text_pattern }
          - { label: "Описание", name: "description", widget: "text", required: false, pattern: *optional_text_pattern }
          - label: "Показатели"
            name: "metrics"
            widget: "list"
            required: false
            fields:
              - label: "Иконка"
                name: "icon"
                widget: "select"
                required: false
                default: "cube"
                options:
                  - { label: "Календарь", value: "calendar" }
                  - { label: "Куб", value: "cube" }
                  - { label: "Модули", value: "modules" }
                  - { label: "Пользователи", value: "users" }
              - { label: "Значение", name: "value", widget: "string", pattern: *metric_value_pattern }
              - { label: "Подпись", name: "label", widget: "string", pattern: *required_text_pattern }
          - label: "Клиенты"
            name: "clients"
            widget: "list"
            fields:
              - { label: "Опубликовано", name: "published", widget: "boolean", default: true }
              - { label: "Порядок", name: "order", widget: "number", value_type: "int", min: 1 }
              - { label: "Название", name: "name", widget: "string", pattern: *required_text_pattern }
              - { label: "Описание", name: "description", widget: "text", pattern: *required_text_pattern }
              - { label: "Рабочие места", name: "workplaces", widget: "string", pattern: *metric_value_pattern }
              - { label: "Изображение карточки 3D-карусели (292x204 px)", name: "image", widget: "image", required: false, hint: "Если поле пустое, сайт использует fallback-изображение из public/assets/trust." }
              - label: "Теги"
                name: "tags"
                widget: "list"
                required: false
              - { label: "Текст ссылки на кейс", name: "caseTitle", widget: "string", required: false, pattern: *optional_text_pattern }
              - { label: "URL кейса", name: "caseUrl", widget: "string", required: false, pattern: &url_pattern ['^(?:/|#|https?://)[A-Za-z0-9._~:/?#\[\]@!$&''()*+,;=%-]+$', "Укажите относительный путь, якорь или URL, начинающийся с /, #, http:// или https://."] }
              - { label: "Открыть кейс в новой вкладке", name: "newTab", widget: "boolean", default: false }
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "title", widget: "string", required: false, pattern: *optional_text_pattern }
              - { label: "Описание", name: "description", widget: "text", required: false, pattern: *optional_text_pattern }
              - label: "Кнопки CTA"
                name: "buttons"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Показывать", name: "visible", widget: "boolean", default: true }
                  - { label: "Порядок", name: "order", widget: "number", value_type: "int", min: 1 }
                  - { label: "Текст кнопки", name: "label", widget: "string", pattern: *required_text_pattern }
                  - { label: "URL кнопки", name: "url", widget: "string", pattern: *url_pattern }
                  - { label: "Открыть в новой вкладке", name: "newTab", widget: "boolean", default: false }

  - name: "news"
    label: "Новости"
    label_singular: "Материал"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["publishDate", "title", "category", "status"]
    view_filters:
      - label: "Опубликовано"
        field: "status"
        pattern: "published"
      - label: "Черновики"
        field: "status"
        pattern: "draft"
      - label: "Скрыто"
        field: "status"
        pattern: "hidden"
    fields:
      - label: "Статус"
        name: "status"
        widget: "select"
        default: "draft"
        options:
          - { label: "Черновик", value: "draft" }
          - { label: "Опубликовано", value: "published" }
          - { label: "Скрыто", value: "hidden" }
      - label: "Тип материала"
        name: "type"
        widget: "select"
        default: "news"
        options:
          - { label: "Новость", value: "news" }
          - { label: "Статья", value: "article" }
          - { label: "Кейс", value: "case" }
          - { label: "Исследование", value: "research" }
          - { label: "Мероприятие", value: "event" }
          - { label: "Видео", value: "video" }
      - label: "Заголовок"
        name: "title"
        widget: "string"
        pattern: *required_text_pattern
      - label: "Краткий анонс"
        name: "description"
        widget: "text"
        pattern: *required_text_pattern
        hint: "1-2 предложения для карточки, страницы и поискового описания."
      - label: "Дата публикации"
        name: "publishDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Дата обновления"
        name: "updatedDate"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Категория"
        name: "category"
        widget: "select"
        default: "Новости компании"
        options:
          - "Новости компании"
          - "МИС Авиценна"
          - "Докки"
          - "Докки Эксперт"
          - "Исследования"
          - "Аналитика"
          - "Кейсы"
          - "Мероприятия"
          - "Интеграции"
          - "Цифровая медицина"
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
      - label: "Автор"
        name: "author"
        widget: "string"
        default: "Команда КостаСофт"
        pattern: *required_text_pattern
      - label: "Время чтения"
        name: "readingTime"
        widget: "string"
        required: false
        pattern: &reading_time_pattern ['^\\d+\\s*(?:мин(?:ут[аы]?)?|ч(?:ас(?:а|ов)?)?)$', "Например: 4 минуты, 7 мин или 1 час."]
        hint: "Например: 4 минуты."
      - label: "Показывать в подборках"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
      - label: "Обложка (1200x675+ px, 16:9)"
        name: "coverImage"
        widget: "image"
        required: false
        dimension_validation:
          minWidth: 1200
          minHeight: 675
          aspectRatio: "16:9"
          tolerance: 0.02
        hint: "Рекомендуемый формат: WebP/JPG, 1200x675 или похожее соотношение 16:9."
      - label: "Alt-текст обложки"
        name: "coverAlt"
        widget: "string"
        required: false
        pattern: *optional_text_pattern
      - label: "Галерея изображений"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Изображение (1200x675+ px, 16:9)", name: "image", widget: "image" }
          - { label: "Alt-текст", name: "alt", widget: "string", required: false, pattern: *optional_text_pattern }
          - { label: "Подпись", name: "caption", widget: "string", required: false, pattern: *optional_text_pattern }
      - label: "Внешние документы и PDF"
        name: "attachments"
        widget: "list"
        required: false
        fields:
          - { label: "Название", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Ссылка", name: "url", widget: "string", pattern: *url_pattern }
      - label: "Встроенные материалы"
        name: "embeds"
        widget: "list"
        required: false
        fields:
          - { label: "Название", name: "title", widget: "string", pattern: *required_text_pattern }
          - { label: "Ссылка для встраивания", name: "url", widget: "string", pattern: *url_pattern }
          - label: "Тип"
            name: "type"
            widget: "select"
            default: "document"
            options:
              - { label: "Презентация", value: "presentation" }
              - { label: "Документ", value: "document" }
              - { label: "Видео", value: "video" }
      - label: "Ссылка на видео"
        name: "videoUrl"
        widget: "string"
        required: false
        pattern: *url_pattern
        hint: "Для видео вставьте embed-ссылку видеохостинга. Сам видеофайл не загружайте в сайт."
      - label: "Видеохостинг"
        name: "videoProvider"
        widget: "string"
        required: false
        pattern: *optional_text_pattern
        hint: "Например: VK Video, RuTube, YouTube."
      - label: "Длительность видео"
        name: "videoDuration"
        widget: "string"
        required: false
        pattern: &duration_pattern ['^P(?=.+)(?:\\d+Y)?(?:\\d+M)?(?:\\d+D)?(?:T(?:\\d+H)?(?:\\d+M)?(?:\\d+S)?)?$', "Используйте ISO 8601, например PT5M30S."]
        hint: "Для schema.org лучше использовать ISO 8601, например PT5M30S."
      - label: "Расшифровка видео"
        name: "transcript"
        widget: "text"
        required: false
        pattern: *optional_text_pattern
      - label: "SEO title"
        name: "seoTitle"
        widget: "string"
        required: false
        pattern: *optional_text_pattern
      - label: "SEO description"
        name: "seoDescription"
        widget: "text"
        required: false
        pattern: *optional_text_pattern
      - label: "SEO keywords"
        name: "seoKeywords"
        widget: "list"
        required: false
      - label: "Текст материала"
        name: "body"
        widget: "markdown"
